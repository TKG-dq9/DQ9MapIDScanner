<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DQ9 Map Receiver</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body style="font-family: monospace; background: #313131; color: #fff; margin: 0; padding: 20px; text-align: center;">

    <div style="background: #424242; border: 2px dashed #106BFF; display: inline-block; padding: 15px 40px; border-radius: 10px; margin: 20px auto;">
        <span style="font-size: 15px; text-transform: uppercase; letter-spacing: 1px; color: #106BFF; display: block;">Room ID</span>
        <span id="codeDisplay" style="font-size: 48px; font-weight: bold; font-family: monospace; color: #fff; letter-spacing: 4px;">----</span>
    </div>

    <div style="max-width: 700px; margin: 30px auto 0 auto; background: #424242; padding: 15px; border-radius: 8px; border: 1px solid #444;">
        <table style="width: 100%; border-collapse: collapse; text-align: center; margin: 0 auto; font-family: monospace; font-size: 15px;">
            <thead>
               <tr style="border-bottom: 2px solid #555; color: #fff;">
                     <th style="padding: 10px;">#</th><th>FQ</th><th>Rank</th><th>Seed</th><th>@</th><th>MelonGx</th><th>yab</th>
               </tr>
            </thead>
            <tbody id="pcLogBody"></tbody>
         </table>
    </div>

    <script>
        const codeDisplay = document.getElementById("codeDisplay");
        const pcLogBody = document.getElementById("pcLogBody");

        let firstScan = true;

        // 1. Generate a random 4-digit hex pairing code (0000 to FFFF)
        const randomNum = Math.floor(Math.random() * 65536);
        const pairingCode = randomNum.toString(16).toUpperCase().padStart(4, '0');
        codeDisplay.innerText = pairingCode;

        // 2. Connect to the public broker
        const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

        client.on('connect', () => {
            // Subscribe to this specific room's channel
            client.subscribe(`dq9/grotto/${pairingCode}`);
        });

        client.on('message', (topic, message) => {
            const data = JSON.parse(message.toString());

            // Add item to the rolling table
            const row = pcLogBody.insertRow(0);
            row.style.borderBottom = "1px solid #333";
            row.style.height = "40px";
            
            row.innerHTML = `
                <td>${data.scanCount}</td>
                <td>${data.fqHex}</td>
                <td>${data.catHex}</td>
                <td>${data.seedHex}</td>
                <td>${data.locHex}</td>
                <td><a href="${data.grottoUrl}" target="_blank" style="color:#106BFF; text-decoration:none;">Link</a></td>
                <td><a href="${data.yabdUrl}" target="_blank" style="color:#106BFF; text-decoration:none;">Link</a></td>
            `;
        });
    </script>
</body>
</html>

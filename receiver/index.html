<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DQ9 Map Receiver</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body style="font-family: monospace; background: #000; color: #fff; margin: 0; padding: 20px; text-align: center;">

    <div style="margin-bottom: 15px; display: inline-block;">
        
        <div style="background: #222; display: inline-block; padding: 10px 20px; border-radius: 10px; margin-right: 15px; vertical-align: middle; text-align: center;">
            <label for="modeSelect" style="font-size: 15px; font-weight: bold; letter-spacing: 1px; color: #9CC6F7; display: block; margin-bottom: 10px;">Mode:</label>
            <select id="modeSelect" style="padding: 8px; font-size: 15px; font-weight: bold; border-radius: 5px; border: none; outline: none; background: #000; color: #fff; font-family: monospace; width: 100px; text-align: center;">
                <option value="scanner">Scanner</option>
                <option value="receiver" selected>Receiver</option>
            </select>
        </div>

        <div style="background: #222; display: inline-block; padding: 10px 20px; border-radius: 10px; vertical-align: middle;">
            <span style="font-size: 15px; font-weight: bold; letter-spacing: 1px; color: #9CC6F7; display: block;">Room ID:</span>
            <span id="codeDisplay" style="font-size: 30px; font-weight: bold; font-family: monospace; color: #fff; letter-spacing: 4px;">----</span>
        </div>

    </div>

    <div style="max-width: 700px; margin: 30px auto 0 auto; background: #222; padding: 15px; border-radius: 8px;">
        <table style="width: 100%; border-collapse: collapse; text-align: center; margin: 0 auto; font-family: monospace; font-size: 15px;">
            <thead>
               <tr style="border-bottom: 2px solid #555; color: #fff;">
                     <th style="padding: 10px;">#</th><th>Rank</th><th>Seed</th><th>@</th><th>Grotto Searcher</th><th>yab's DQ9 Tools</th><th>A-Table Generator</th>
               </tr>
            </thead>
            <tbody id="pcLogBody"></tbody>
         </table>
    </div>

    <script>
        const codeDisplay = document.getElementById("codeDisplay");
        const pcLogBody = document.getElementById("pcLogBody");

        let firstScan = true;

        const randomNum = Math.floor(Math.random() * 65536);
        const pairingCode = randomNum.toString(16).toUpperCase().padStart(4, '0');
        codeDisplay.innerText = pairingCode;

        const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

        client.on('connect', () => {
            client.subscribe(`dq9/grotto/${pairingCode}`);
        });

        client.on('message', (topic, message) => {
            const data = JSON.parse(message.toString());

            const row = pcLogBody.insertRow(0);
            row.style.borderBottom = "1px solid #333";
            row.style.height = "40px";
            
            row.innerHTML = `
                <td>${data.scanCount}</td>
                <td>${data.catHex}</td>
                <td>${data.seedHex}</td>
                <td>${data.locHex}</td>
                <td><a href="${data.grottoUrl}" target="_blank" style="color:#9CC6F7; text-decoration:underline;">Link</a></td>
                <td><a href="${data.yabdUrl}" target="_blank" style="color:#9CC6F7; text-decoration:underline;">Link</a></td>
                <td><a href="${data.atUrl}" target="_blank" style="color:#9CC6F7; text-decoration:underline;">Link</a></td>
            `;
        });

        // Switch pages based on dropdown selection
        document.getElementById("modeSelect").addEventListener("change", (e) => {
            if (e.target.value === "scanner") {
                window.location.href = "../index.html";
            }
        });
        
    </script>
</body>
</html>

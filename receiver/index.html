<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DQ9MapIDReceiver</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body style="font-family: sans-serif; background: #1a1a1a; color: #fff; margin: 0; padding: 20px; text-align: center;">

    <div style="background: #2a2a2a; border: 2px dashed #00bcd4; display: inline-block; padding: 15px 40px; border-radius: 10px; margin: 20px auto;">
        <span style="font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: #aaa; display: block;">Room ID</span>
        <span id="codeDisplay" style="font-size: 48px; font-weight: bold; font-family: monospace; color: #fff; letter-spacing: 4px;">----</span>
    </div>

    <div id="alertPanel" style="max-width: 500px; margin: 20px auto; background: #333; padding: 20px; border-radius: 10px; border-left: 5px solid #ff9800; display: none; text-align: left; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
        <h3 id="alertTitle" style="margin-top:0; margin-bottom: 5px; color: #ff9800; font-size: 16px;">New Map Detected</h3>
        
        <p id="mapSummaryDisplay" style="font-family: monospace; font-size: 32px; font-weight: bold; margin: 15px 0; color: #00bcd4; letter-spacing: 2px; text-align: center; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 5px; border: 1px solid #444;">
           -- ---- @ --
        </p>
        
        <div style="margin-top: 15px; display: flex; gap: 10px;">
            <a id="btnGrotto" href="#" target="_blank" style="flex:1; text-align:center; background:#00bcd4; color:#fff; padding: 12px; border-radius:5px; text-decoration:none; font-weight:bold; font-size: 14px;">Grotto Searcher</a>
            <a id="btnYabd" href="#" target="_blank" style="flex:1; text-align:center; background:#4CAF50; color:#fff; padding: 12px; border-radius:5px; text-decoration:none; font-weight:bold; font-size: 14px;">yab's DQ9 Tools</a>
        </div>
    </div>

    <div style="max-width: 700px; margin: 30px auto 0 auto; background: #222; padding: 15px; border-radius: 8px; border: 1px solid #444;">
        <h3 style="margin-top: 0; text-align: left; color: #aaa;">Scan History</h3>
        <table style="width: 100%; border-collapse: collapse; text-align: center; margin: 0 auto; font-family: monospace; font-size: 14px;">
            <thead>
               <tr style="border-bottom: 2px solid #555; color: #aaa;">
                     <th style="padding: 10px;">#</th><th>FQ</th><th>Rank</th><th>Seed</th><th>@</th><th>MelonGx</th><th>yab</th>
               </tr>
            </thead>
            <tbody id="pcLogBody"></tbody>
         </table>
    </div>

    <script>
        const codeDisplay = document.getElementById("codeDisplay");
        const pcLogBody = document.getElementById("pcLogBody");
        const alertPanel = document.getElementById("alertPanel");
        const alertTitle = document.getElementById("alertTitle");
        const btnGrotto = document.getElementById("btnGrotto");
        const btnYabd = document.getElementById("btnYabd");

        let firstScan = true;

        // 1. Generate a random 4-digit hex pairing code (0000 to FFFF)
        const randomNum = Math.floor(Math.random() * 65536);
        const pairingCode = randomNum.toString(16).toUpperCase().padStart(4, '0');
        codeDisplay.innerText = pairingCode;

        // 2. Connect to the public broker
        const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

        client.on('connect', () => {
            // Subscribe to this specific room's channel
            client.subscribe(`dq9/grotto/${pairingCode}`);
        });

        client.on('message', (topic, message) => {
            const data = JSON.parse(message.toString());

            // Update alert panel
            alertTitle.innerText = `New Map Detected (Scan #${data.scanCount})`;
            mapSummaryDisplay.innerText = `${data.catHex} ${data.seedHex} @ ${data.locHex}`;
            
            btnGrotto.href = data.grottoUrl;
            btnYabd.href = data.yabdUrl;
            alertPanel.style.display = "block";

            // Add item to the rolling table
            const row = pcLogBody.insertRow(0);
            row.style.borderBottom = "1px solid #333";
            row.style.height = "40px";
            
            row.innerHTML = `
                <td>${data.scanCount}</td>
                <td>${data.fqHex}</td>
                <td>${data.catHex}</td>
                <td>${data.seedHex}</td>
                <td>${data.locHex}</td>
                <td><a href="${data.grottoUrl}" target="_blank" style="color:#00bcd4; text-decoration:none;">Link</a></td>
                <td><a href="${data.yabdUrl}" target="_blank" style="color:#00bcd4; text-decoration:none;">Link</a></td>
            `;
        });
    </script>
</body>
</html>

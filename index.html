<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DQ9 Map Scanner</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body style="font-family: monospace; background: #000; color: #fff; margin: 0; padding: 10px; text-align: center;">

    <div style="margin-bottom: 15px; display: inline-block;">
        
        <div style="background: #222; display: inline-block; padding: 10px; border-radius: 8px; margin-right: 10px; vertical-align: top; text-align: center;">
            <label for="modeSelect" style="font-size: 15px; font-weight: bold; color: #9CC6F7; display: block; margin-bottom: 10px;">Mode:</label>
            <select id="modeSelect" style="padding: 8px; font-size: 15px; font-weight: bold; border-radius: 5px; border: none; outline: none; background: #000; color: #fff; font-family: monospace; width: 100px; text-align: center;">
                <option value="scanner" selected>Scanner</option>
                <option value="receiver">Receiver</option>
            </select>
        </div>

        <div style="background: #222; display: inline-block; padding: 10px; border-radius: 8px; vertical-align: top; text-align: center;">
            <label for="pairingCode" style="font-size: 15px; font-weight: bold; color: #9CC6F7; display: block; margin-bottom: 5px;">Room ID:</label>
            <input type="text" id="pairingCode" placeholder="----" maxlength="4" style="padding: 8px; font-size: 15px; font-weight: bold; border-radius: 5px; border: none; outline: none; background: #000; color: #fff; text-align: center; width: 80px; font-family: monospace; text-transform: uppercase; height: 37px; box-sizing: border-box;">
            <span id="cloudStatus" style="font-size: 12px; display: block; margin-top: 5px; color: #FFC600;">Connecting</span>
        </div>

    </div>

    <div>
        <video id="cam" autoplay playsinline style="display:none;"></video>
    </div>
    
    <div style="margin-bottom: 10px;">
        <canvas id="c" style="width: 100%; max-width: 360px; aspect-ratio: 4/3; background: #000; border: 2px solid #555; border-radius: 8px;"></canvas>
    </div>

    <button id="toggleBtn" style="padding: 12px 24px; font-size: 16px; font-weight: bold; font-family: monospace; background: #52C618; color: white; border: none; border-radius: 5px; cursor: pointer; margin-bottom: 15px;">
        Scan
    </button>

    <div style="max-width: 600px; margin-left: auto; margin-right: auto; background: #222; padding: 8px; border-radius: 8px;">
        <table style="width: 100%; border-collapse: collapse; text-align: center; font-family: monospace; font-size: 13px; color: #FFF;">
            <thead>
                <tr style="border-bottom: 2px solid #555;">
                    <th style="vertical-align: middle;">#</th>
                    <th style="vertical-align: middle;">Rank</th>
                    <th style="vertical-align: middle;">Seed</th>
                    <th style="vertical-align: middle;">@</th>
                    <th style="vertical-align: middle;">Grotto<br>Searcher</th>
                    <th style="vertical-align: middle;">yab's DQ9<br>Tools</th>
                    <th style="vertical-align: middle;">A-Table<br>Generator</th>
                </tr>
            </thead>
            <tbody id="logBody"></tbody>
        </table>
    </div>

    <script>
        const video = document.getElementById("cam");
        const canvas = document.getElementById("c");
        const ctx = canvas.getContext("2d");
        const logBody = document.getElementById("logBody");
        const toggleBtn = document.getElementById("toggleBtn");
        const cloudStatus = document.getElementById("cloudStatus");
        const pairingInput = document.getElementById("pairingCode");

        const COLS = 8, ROWS = 4, BUFFER_SIZE = 5;
        let buffer = [], stream = null, isScanning = false, scanCount = 0;

        const mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

        mqttClient.on('connect', () => {
            cloudStatus.innerText = "Online";
            cloudStatus.style.color = "#52C618";
        });

        mqttClient.on('error', () => {
            cloudStatus.innerText = "Offline";
            cloudStatus.style.color = "#FF0808";
        });

        toggleBtn.addEventListener("click", () => {
            isScanning ? stopScanner() : startScanner();
        });

        function startScanner() {
            buffer = [];
            navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } } })
                .then(s => {
                    stream = s;
                    video.srcObject = s;
                    toggleBtn.innerText = "Stop";
                    toggleBtn.style.background = "#FF0808";
                    isScanning = true;
                    scanLoop();
                })
                .catch(err => alert("Camera error: " + err.message));
        }

        function stopScanner() {
            if (stream) stream.getTracks().forEach(t => t.stop());
            video.srcObject = null;
            toggleBtn.innerText = "Scan";
            toggleBtn.style.background = "#52C618";
            isScanning = false;
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function categorizeRank(r) {
            if (r >= 2 && r <= 55) return 0x02;
            if (r <= 60) return 0x38; if (r <= 75) return 0x3D;
            if (r <= 80) return 0x4C; if (r <= 100) return 0x51;
            if (r <= 120) return 0x65; if (r <= 140) return 0x79;
            if (r <= 160) return 0x8D; if (r <= 180) return 0xA1;
            if (r <= 200) return 0xB5; if (r <= 220) return 0xC9;
            if (r <= 248) return 0xDD;
            return r;
        }

        function scanLoop() {
            if (!isScanning) return;
            if (canvas.width !== 640 || canvas.height !== 480) {
                canvas.width = 640; canvas.height = 480;
            }

            const vWidth = video.videoWidth;
            const vHeight = video.videoHeight;
            const ratio = Math.max(canvas.width / vWidth, canvas.height / vHeight);
            const drawW = vWidth * ratio; const drawH = vHeight * ratio;
            const dx = (canvas.width - drawW) / 2; const dy = (canvas.height - drawH) / 2;

            ctx.drawImage(video, dx, dy, drawW, drawH);

            const boxWidth = canvas.width * 0.7; 
            const boxHeight = boxWidth * (3 / 4);
            const offsetX = (canvas.width - boxWidth) / 2; 
            const offsetY = (canvas.height - boxHeight) / 2;
            const cellW = boxWidth / COLS; const cellH = cellW;
            const gridOffsetY = offsetY + (boxHeight - (cellH * ROWS)) / 2;

            let bits = [], validFrame = true;

            const corners = [{x:offsetX+15, y:offsetY+15}, {x:offsetX+boxWidth-15, y:offsetY+15}, 
                             {x:offsetX+15, y:offsetY+boxHeight-15}, {x:offsetX+boxWidth-15, y:offsetY+boxHeight-15}];
            for (let p of corners) {
                let d = ctx.getImageData(Math.floor(p.x), Math.floor(p.y), 1, 1).data;
                if (!(d[0] > 130 && d[1] < 130 && d[2] > 130)) validFrame = false;
            }

            if (validFrame) {
                for (let y = 0; y < ROWS; y++) {
                    for (let x = 0; x < COLS; x++) {
                        let d = ctx.getImageData(Math.floor(offsetX + x*cellW + cellW/2), Math.floor(gridOffsetY + y*cellH + cellH/2), 1, 1).data;
                        bits.push(((d[0]+d[1]+d[2])/3) < 100 ? 1 : 0);
                    }
                }
                buffer.push(bits);
                if (buffer.length > BUFFER_SIZE) buffer.shift();
            } else {
                buffer = [];
            }

            ctx.strokeStyle = validFrame ? "#9CC6F7" : "#52C618";
            ctx.lineWidth = 6;
            ctx.strokeRect(offsetX, offsetY, boxWidth, boxHeight);

            if (buffer.length === BUFFER_SIZE) {
                const stable = buffer.reduce((acc, f) => f.map((b, i) => b + (acc[i] || 0)), []).map(b => b > BUFFER_SIZE/2 ? 1 : 0);
                const rawRank = parseInt(stable.slice(0,8).join(""), 2);
                const seed = parseInt(stable.slice(8,24).join(""), 2);
                const loc = parseInt(stable.slice(24,32).join(""), 2);
                const catRank = categorizeRank(rawRank);
                
                const fqHex = rawRank.toString(16).toUpperCase().padStart(2, '0');
                const catHex = catRank.toString(16).toUpperCase().padStart(2, '0');
                const seedHex = seed.toString(16).toUpperCase().padStart(4, '0');
                const locHex = loc.toString(16).toUpperCase().padStart(2, '0');
                
                const grottoUrl = `https://dqix.github.io/Grotto-Searcher/?id=${catHex}${seedHex}`;
                const yabdUrl = `https://www.yabd.org/apps/dq9/grottodetails.php?map=${catHex}${seedHex}`;
                const atUrl = `http://dq9.s1001.xrea.com/rndnum1.cgi?seed=${seedHex}`;
                
                const row = logBody.insertRow(0);
                scanCount++;
                row.innerHTML = `<td>${scanCount}</td><td>${catHex}</td><td>${seedHex}</td><td>${locHex}</td>
                                 <td><a href="${grottoUrl}" target="_blank" style="color:#9CC6F7">Link</a></td>
                                 <td><a href="${yabdUrl}" target="_blank" style="color:#9CC6F7">Link</a></td>
                                 <td><a href="${atUrl}" target="_blank" style="color:#9CC6F7">Link</a></td>`;
                
                const code = pairingInput.value.trim().toUpperCase();
                if (code && mqttClient.connected) {
                    const payload = { scanCount, catHex, seedHex, locHex, grottoUrl, yabdUrl, atUrl };
                    mqttClient.publish(`dq9/grotto/${code}`, JSON.stringify(payload));
                }

                stopScanner();
                return;
            }
            requestAnimationFrame(scanLoop);
        }

        // Switch pages based on dropdown selection
        document.getElementById("modeSelect").addEventListener("change", (e) => {
            if (e.target.value === "receiver") {
                window.location.href = "receiver/index.html";
            }
        });

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DQ9 Auto-Scanner</title>
</head>
<body style="font-family: sans-serif; background: #222; color: #fff; margin: 0; padding: 20px; text-align: center;">

    <video id="cam" autoplay playsinline style="display:none;"></video>
    <canvas id="c" style="width: 100%; max-width: 500px; border: 2px solid #555; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);"></canvas>

    <div style="margin-top: 20px; color: #aaa;">
        <p>Align the grid. Scan is automatic!</p>
    </div>

    <div style="margin-top: 20px; max-width: 500px; margin-left: auto; margin-right: auto; background: #333; padding: 10px; border-radius: 8px;">
        <table style="width: 100%; border-collapse: collapse; text-align: center; font-family: monospace; font-size: 18px;">
            <thead>
                <tr style="border-bottom: 2px solid #666; color: #00bcd4;">
                    <th>FQ</th><th>Rank</th><th>Seed</th><th>@</th>
                </tr>
            </thead>
            <tbody id="logBody"></tbody>
        </table>
    </div>

    <script>
        const video = document.getElementById("cam");
        const canvas = document.getElementById("c");
        const ctx = canvas.getContext("2d");
        const logBody = document.getElementById("logBody");

        const COLS = 8, ROWS = 4, BUFFER_SIZE = 5;
        let buffer = [];
        let canScan = true; // Cooldown gate

        navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } } })
            .then(stream => { video.srcObject = stream; video.play(); })
            .catch(err => alert("Camera error: " + err.message));

        function categorizeRank(r) {
            if (r >= 2 && r <= 55) return 0x02;
            if (r <= 60) return 0x38;
            if (r <= 75) return 0x3D;
            if (r <= 80) return 0x4C;
            if (r <= 100) return 0x51;
            if (r <= 120) return 0x65;
            if (r <= 140) return 0x79;
            if (r <= 160) return 0x8D;
            if (r <= 180) return 0xA1;
            if (r <= 200) return 0xB5;
            if (r <= 220) return 0xC9;
            if (r <= 248) return 0xDD;
            return r;
        }

        function scanLoop() {
            if (video.videoWidth === 0) { requestAnimationFrame(scanLoop); return; }
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);

            // ... [Grid Drawing Logic same as before] ...
            const boxWidth = canvas.width * 0.8; const boxHeight = boxWidth * (3 / 4);
            const offsetX = (canvas.width - boxWidth) / 2; const offsetY = (canvas.height - boxHeight) / 2;
            
            // Check Frame & Bits
            let bits = [], validFrame = true;
            // ... [Insert previous Bit-reading logic here] ...
            
            // Auto-trigger logic
            if (validFrame && canScan) {
                buffer.push(bits);
                if (buffer.length >= BUFFER_SIZE) {
                    const stable = majorityVote(buffer);
                    const rawRank = parseInt(stable.slice(0,8).join(""), 2);
                    const seed = parseInt(stable.slice(8,24).join(""), 2);
                    const loc = parseInt(stable.slice(24,32).join(""), 2);
                    const catRank = categorizeRank(rawRank);
                    
                    // Log to table
                    const row = logBody.insertRow(0);
                    row.innerHTML = `<td>${rawRank.toString(16).toUpperCase().padStart(2,'0')}</td>
                                     <td style="color:#00bcd4">${catRank.toString(16).toUpperCase().padStart(2,'0')}</td>
                                     <td>${seed.toString(16).toUpperCase().padStart(4,'0')}</td>
                                     <td>${loc.toString(16).toUpperCase().padStart(2,'0')}</td>`;
                    
                    // Open URL
                    window.open(`https://dqix.github.io/Grotto-Searcher/?id=${catRank.toString(16).toUpperCase().padStart(2,'0')}${seed.toString(16).toUpperCase().padStart(4,'0')}`, '_blank');
                    
                    // Cooldown
                    canScan = false;
                    setTimeout(() => { canScan = true; buffer = []; }, 3000);
                }
            } else if (!canScan) {
                ctx.strokeStyle = "yellow"; // Cooldown state
                ctx.strokeRect(offsetX, offsetY, boxWidth, boxHeight);
            }
            requestAnimationFrame(scanLoop);
        }

        function majorityVote(frames) { /* ... [Same as before] ... */ }
        video.onloadedmetadata = () => scanLoop();
    </script>
</body>
</html>

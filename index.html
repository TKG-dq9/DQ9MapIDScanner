<video id="cam" autoplay playsinline style="display:none;"></video>
<canvas id="c" style="width: 100%; max-width: 500px; border: 2px solid black;"></canvas>

<div style="text-align: center; margin-top: 20px;">
    <button id="captureBtn" style="padding: 15px 30px; font-size: 20px; font-weight: bold; cursor: pointer;">
        Capture & Redirect
    </button>
</div>

<script>
    const video = document.getElementById("cam");
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const captureBtn = document.getElementById("captureBtn");
    
    const COLS = 8;
    const ROWS = 4;
    let buffer = [];
    const BUFFER_SIZE = 5;
    
    let currentDecodedUrl = "";

    // 1. start camera
    navigator.mediaDevices.getUserMedia({video: { facingMode: "environment" } })
        .then(stream => {
            video.srcObject = stream; 
            video.play(); 
        });

    function waitForVideo() {
        if (video.videoWidth === 0) {
            requestAnimationFrame(waitForVideo); 
            return; 
        } 
        scanLoop(); 
    }
    video.onloadedmetadata = () => { waitForVideo(); };

    // 3. main loop
    function scanLoop() {
        if (video.videoWidth === 0) {
            requestAnimationFrame(scanLoop); 
            return; 
        }
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        ctx.drawImage(video, 0, 0);
        
        // 1. Create the outer 4:3 Targeting Box to match the DS Screen edges
        const boxWidth = canvas.width * 0.8; 
        const boxHeight = boxWidth * (3 / 4); // Outer box is 4:3 (24 tiles high)
        const offsetX = (canvas.width - boxWidth) / 2;
        const offsetY = (canvas.height - boxHeight) / 2;

        // 2. Scale grid to 32x24 tile specs (Grid takes 100% width, centered vertically)
        const gridWidth = boxWidth; // 8 cols * 4 tiles = 32 tiles wide (Full width)
        const cellW = gridWidth / COLS;
        const cellH = cellW; // Forces 1:1 square blocks (4x4 tiles)
        const gridHeight = cellH * ROWS; // 4 rows * 4 tiles = 16 tiles high
        
        const gridOffsetX = offsetX;
        // Centers the 16-tile-high grid inside the 24-tile-high screen
        const gridOffsetY = offsetY + (boxHeight - gridHeight) / 2;

        let bits = [];
        let validFrame = true;

        function isMagenta(r, g, b) {
            return r > 130 && g < 130 && b > 130;
        }

        // 3. Look for Magenta in the 4 extreme corners of the 4:3 DS screen box
        const corners = [
            { x: offsetX + 15, y: offsetY + 15 }, // Top-Left
            { x: offsetX + boxWidth - 15, y: offsetY + 15 }, // Top-Right
            { x: offsetX + 15, y: offsetY + boxHeight - 15 }, // Bottom-Left
            { x: offsetX + boxWidth - 15, y: offsetY + boxHeight - 15 } // Bottom-Right
        ];

        for (let corner of corners) {
            const data = ctx.getImageData(corner.x, corner.y, 1, 1).data;
            if (!isMagenta(data[0], data[1], data[2])) {
                validFrame = false; 
            }
            ctx.fillStyle = "magenta";
            ctx.fillRect(corner.x - 4, corner.y - 4, 8, 8);
        }

        // 4. Read the 8x4 grid pixels (Lands exactly in the center of the 2x2 active squares)
        for (let y = 0; y < ROWS; y++) {
            for (let x = 0; x < COLS; x++) {
                const px = Math.floor(gridOffsetX + x * cellW + cellW / 2);
                const py = Math.floor(gridOffsetY + y * cellH + cellH / 2);
                
                const data = ctx.getImageData(px, py, 1, 1).data;
                const r = data[0], g = data[1], b = data[2];

                const brightness = (r + g + b) / 3;
                bits.push(brightness < 100 ? 1 : 0); 
                
                ctx.fillStyle = "yellow";
                ctx.fillRect(px - 2, py - 2, 4, 4);
            }
        }

        // 5. Draw the UI elements
        // Outer 4:3 DS Screen border
        ctx.strokeStyle = validFrame ? "cyan" : "lime";
        ctx.lineWidth = 4;
        ctx.strokeRect(offsetX, offsetY, boxWidth, boxHeight);

        // Inner 8x4 Grid lines
        ctx.strokeStyle = validFrame ? "rgba(0, 255, 255, 0.6)" : "rgba(0, 255, 0, 0.4)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let x = 1; x < COLS; x++) {
            ctx.moveTo(gridOffsetX + x * cellW, gridOffsetY);
            ctx.lineTo(gridOffsetX + x * cellW, gridOffsetY + gridHeight);
        }
        for (let y = 1; y < ROWS; y++) {
            ctx.moveTo(gridOffsetX, gridOffsetY + y * cellH);
            ctx.lineTo(gridOffsetX + gridWidth, gridOffsetY + y * cellH);
        }
        ctx.stroke();

        // 6. Save to buffer only if valid
        if (validFrame) {
            buffer.push(bits);
            if (buffer.length > BUFFER_SIZE) { buffer.shift(); }
        } else {
            buffer = []; 
        }

        // 7. Update URL if stable
        if (buffer.length === BUFFER_SIZE) {
            const stable = majorityVote(buffer);
            const rank = parseInt(stable.slice(0,8).join(""), 2);
            const seed = parseInt(stable.slice(8,24).join(""), 2);
            const loc  = parseInt(stable.slice(24,32).join(""), 2);
            
            const rankHex = rank.toString(16).toUpperCase().padStart(2, '0');
            const seedHex = seed.toString(16).toUpperCase().padStart(4, '0');
            const locHex  = loc.toString(16).toUpperCase().padStart(2, '0');
            
            currentDecodedUrl = `https://dqix.github.io/Grotto-Searcher/?id=${rankHex}${seedHex}`;
        }
        
        requestAnimationFrame(scanLoop);
    }

        // 5. Draw the UI elements
        // Outer 4:3 DS Screen border
        ctx.strokeStyle = validFrame ? "cyan" : "lime";
        ctx.lineWidth = 4;
        ctx.strokeRect(offsetX, offsetY, boxWidth, boxHeight);

        // Inner 8x4 Grid lines (drawn explicitly around the square data area)
        ctx.strokeStyle = validFrame ? "rgba(0, 255, 255, 0.6)" : "rgba(0, 255, 0, 0.4)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let x = 1; x < COLS; x++) {
            ctx.moveTo(gridOffsetX + x * cellW, gridOffsetY);
            ctx.lineTo(gridOffsetX + x * cellW, gridOffsetY + gridHeight);
        }
        for (let y = 1; y < ROWS; y++) {
            ctx.moveTo(gridOffsetX, gridOffsetY + y * cellH);
            ctx.lineTo(gridOffsetX + gridWidth, gridOffsetY + y * cellH);
        }
        ctx.stroke();

        // 6. Save to buffer only if valid
        if (validFrame) {
            buffer.push(bits);
            if (buffer.length > BUFFER_SIZE) { buffer.shift(); }
        } else {
            buffer = []; 
        }

        // 7. Update URL if stable
        if (buffer.length === BUFFER_SIZE) {
            const stable = majorityVote(buffer);
            const rank = parseInt(stable.slice(0,8).join(""), 2);
            const seed = parseInt(stable.slice(8,24).join(""), 2);
            const loc  = parseInt(stable.slice(24,32).join(""), 2);
            
            const rankHex = rank.toString(16).toUpperCase().padStart(2, '0');
            const seedHex = seed.toString(16).toUpperCase().padStart(4, '0');
            const locHex  = loc.toString(16).toUpperCase().padStart(2, '0');
            
            currentDecodedUrl = `https://dqix.github.io/Grotto-Searcher/?id=${rankHex}${seedHex}`;
        }
        
        requestAnimationFrame(scanLoop);
    }

    function majorityVote(frames) {
        const result = [];
        for (let i = 0; i < frames[0].length; i++) {
            let sum = 0;
            for (let f = 0; f < frames.length; f++) {
                sum += frames[f][i];
            }
            result.push(sum > frames.length / 2 ? 1 : 0);
        }
        return result;
    }

    captureBtn.addEventListener("click", () => {
        if (currentDecodedUrl && buffer.length === BUFFER_SIZE) {
            console.log("Redirecting to:", currentDecodedUrl);
            window.location.href = currentDecodedUrl;
        } else {
            alert("Please align the grid! Make sure all cyan dots are inside the black/white squares.");
        }
    });
</script>

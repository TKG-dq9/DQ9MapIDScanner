<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DQ9 Auto-Stop Scanner</title>
</head>
<body style="font-family: sans-serif; background: #222; color: #fff; margin: 0; padding: 20px; text-align: center;">

    <video id="cam" autoplay playsinline style="display:none;"></video>
    
    <button id="toggleBtn" style="padding: 15px 30px; font-size: 18px; font-weight: bold; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer;">
        Start Scanner
    </button>

    <div style="margin-top: 20px;">
        <canvas id="c" style="width: 100%; max-width: 500px; border: 2px solid #555; border-radius: 8px;"></canvas>
    </div>

    <div style="margin-top: 20px; max-width: 500px; margin-left: auto; margin-right: auto; background: #333; padding: 10px; border-radius: 8px;">
        <table style="width: 100%; border-collapse: collapse; text-align: center; font-family: monospace; font-size: 18px;">
            <thead>
                <tr style="border-bottom: 2px solid #666; color: #00bcd4;">
                    <th>FQ</th><th>Rank</th><th>Seed</th><th>@</th>
                </tr>
            </thead>
            <tbody id="logBody"></tbody>
        </table>
    </div>

    <script>
        const video = document.getElementById("cam");
        const canvas = document.getElementById("c");
        const ctx = canvas.getContext("2d");
        const logBody = document.getElementById("logBody");
        const toggleBtn = document.getElementById("toggleBtn");

        const COLS = 8, ROWS = 4, BUFFER_SIZE = 5;
        let buffer = [];
        let stream = null;
        let isScanning = false;

        toggleBtn.addEventListener("click", () => {
            if (isScanning) {
                stopScanner();
            } else {
                startScanner();
            }
        });

        function startScanner() {
            buffer = [];
            navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } } })
                .then(s => {
                    stream = s;
                    video.srcObject = s;
                    video.play();
                    toggleBtn.innerText = "Stop Scanner";
                    toggleBtn.style.background = "#f44336";
                    isScanning = true;
                    scanLoop();
                })
                .catch(err => alert("Camera error: " + err.message));
        }

        function stopScanner() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            video.srcObject = null;
            toggleBtn.innerText = "Start Scanner";
            toggleBtn.style.background = "#4CAF50";
            isScanning = false;
        }

        function categorizeRank(r) {
            if (r >= 2 && r <= 55) return 0x02;
            if (r <= 60) return 0x38; if (r <= 75) return 0x3D;
            if (r <= 80) return 0x4C; if (r <= 100) return 0x51;
            if (r <= 120) return 0x65; if (r <= 140) return 0x79;
            if (r <= 160) return 0x8D; if (r <= 180) return 0xA1;
            if (r <= 200) return 0xB5; if (r <= 220) return 0xC9;
            if (r <= 248) return 0xDD;
            return r;
        }

        function majorityVote(frames) {
            let result = [];
            for (let i = 0; i < frames[0].length; i++) {
                let ones = frames.reduce((acc, frame) => acc + frame[i], 0);
                result.push(ones > frames.length / 2 ? 1 : 0);
            }
            return result;
        }

        function scanLoop() {
            if (!isScanning || video.videoWidth === 0) return;
            
            canvas.width = video.videoWidth; 
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);

            const boxWidth = canvas.width * 0.8; 
            const boxHeight = boxWidth * (3 / 4);
            const offsetX = (canvas.width - boxWidth) / 2; 
            const offsetY = (canvas.height - boxHeight) / 2;
            
            const cellW = boxWidth / COLS;
            const cellH = cellW;
            const gridOffsetY = offsetY + (boxHeight - (cellH * ROWS)) / 2;

            let bits = [], validFrame = true;

            // Frame Detection
            const corners = [{x:offsetX+15, y:offsetY+15}, {x:offsetX+boxWidth-15, y:offsetY+15}, 
                             {x:offsetX+15, y:offsetY+boxHeight-15}, {x:offsetX+boxWidth-15, y:offsetY+boxHeight-15}];
            for (let p of corners) {
                let d = ctx.getImageData(p.x, p.y, 1, 1).data;
                if (!(d[0] > 130 && d[1] < 130 && d[2] > 130)) validFrame = false;
            }

            if (validFrame) {
                for (let y = 0; y < ROWS; y++) {
                    for (let x = 0; x < COLS; x++) {
                        let d = ctx.getImageData(offsetX + x*cellW + cellW/2, gridOffsetY + y*cellH + cellH/2, 1, 1).data;
                        bits.push(((d[0]+d[1]+d[2])/3) < 100 ? 1 : 0);
                    }
                }
                buffer.push(bits);
                if (buffer.length > BUFFER_SIZE) buffer.shift();
            } else {
                buffer = [];
            }

            // Detection Logic
            if (buffer.length === BUFFER_SIZE) {
                const stable = majorityVote(buffer);
                const rawRank = parseInt(stable.slice(0,8).join(""), 2);
                const seed = parseInt(stable.slice(8,24).join(""), 2);
                const loc = parseInt(stable.slice(24,32).join(""), 2);
                const catRank = categorizeRank(rawRank);
                
                const rawRankHex = rawRank.toString(16).toUpperCase().padStart(2, '0');
                const catRankHex = catRank.toString(16).toUpperCase().padStart(2, '0');
                const seedHex = seed.toString(16).toUpperCase().padStart(4, '0');
                const locHex = loc.toString(16).toUpperCase().padStart(2, '0');
                
                const url = `https://dqix.github.io/Grotto-Searcher/?id=${catRankHex}${seedHex}${locHex}`;
                
                const row = logBody.insertRow(0);
                row.innerHTML = `<td>${rawRankHex}</td><td>${catRankHex}</td>
                                 <td><a href="${url}" target="_blank" style="color:#00bcd4; text-decoration:none;">${seedHex}</a></td>
                                 <td>${locHex}</td>`;
                
                stopScanner();
                return; // Stop loop
            }

            ctx.strokeStyle = validFrame ? "cyan" : "lime";
            ctx.lineWidth = 4;
            ctx.strokeRect(offsetX, offsetY, boxWidth, boxHeight);
            
            requestAnimationFrame(scanLoop);
        }
    </script>
</body>
</html>

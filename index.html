<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DQ9 Map ID Scanner</title>
</head>
<body style="font-family: sans-serif; background: #222; color: #fff; margin: 0; padding: 20px; text-align: center;">

    <video id="cam" autoplay playsinline style="display:none;"></video>
    <canvas id="c" style="width: 100%; max-width: 500px; border: 2px solid #555; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);"></canvas>

    <div style="margin-top: 20px;">
        <button id="captureBtn" style="padding: 15px 30px; font-size: 20px; font-weight: bold; background-color: #00bcd4; color: white; border: none; border-radius: 5px; cursor: pointer; transition: 0.2s;">
            Capture & Redirect
        </button>
    </div>

    <script>
        const video = document.getElementById("cam");
        const canvas = document.getElementById("c");
        const ctx = canvas.getContext("2d");
        const captureBtn = document.getElementById("captureBtn");

        const COLS = 8;
        const ROWS = 4;
        let buffer = [];
        const BUFFER_SIZE = 5;

        let currentDecodedUrl = "";

        // 1. Start camera stream
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => {
                video.srcObject = stream;
                video.play();
            })
            .catch(err => {
                alert("Camera error: " + err.message + "\nEnsure you are using HTTPS and have granted camera permissions.");
            });

        function waitForVideo() {
            if (video.videoWidth === 0) {
                requestAnimationFrame(waitForVideo);
                return;
            }
            scanLoop();
        }
        video.onloadedmetadata = () => { waitForVideo(); };

        // 2. Main processing and rendering loop
        function scanLoop() {
            if (video.videoWidth === 0) {
                requestAnimationFrame(scanLoop); 
                return; 
            }
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            ctx.drawImage(video, 0, 0);
            
            // Outer 4:3 DS Screen Box Alignment (24 tiles tall conceptually)
            const boxWidth = canvas.width * 0.8; 
            const boxHeight = boxWidth * (3 / 4); 
            const offsetX = (canvas.width - boxWidth) / 2;
            const offsetY = (canvas.height - boxHeight) / 2;

            // 32x24 tile specifications (8 columns * 4 tiles = 32 tiles wide)
            const gridWidth = boxWidth; 
            const cellW = gridWidth / COLS;
            const cellH = cellW; // Forces 1:1 perfect square grid cells
            const gridHeight = cellH * ROWS; // 4 rows * 4 tiles = 16 tiles high
            
            const gridOffsetX = offsetX;
            // Centers the 16-tile-high grid inside the 24-tile-high frame
            const gridOffsetY = offsetY + (boxHeight - gridHeight) / 2;

            let bits = [];
            let validFrame = true;

            function isMagenta(r, g, b) {
                return r > 130 && g < 130 && b > 130;
            }

            // Look for Magenta background in the 4 extreme corners of the DS screen
            const corners = [
                { x: offsetX + 15, y: offsetY + 15 },
                { x: offsetX + boxWidth - 15, y: offsetY + 15 },
                { x: offsetX + 15, y: offsetY + boxHeight - 15 },
                { x: offsetX + boxWidth - 15, y: offsetY + boxHeight - 15 }
            ];

            for (let corner of corners) {
                const data = ctx.getImageData(corner.x, corner.y, 1, 1).data;
                if (!isMagenta(data[0], data[1], data[2])) {
                    validFrame = false; 
                }
                ctx.fillStyle = "magenta";
                ctx.fillRect(corner.x - 4, corner.y - 4, 8, 8);
            }

            // Read the 8x4 data squares (Targets absolute center of active regions)
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const px = Math.floor(gridOffsetX + x * cellW + cellW / 2);
                    const py = Math.floor(gridOffsetY + y * cellH + cellH / 2);
                    
                    const data = ctx.getImageData(px, py, 1, 1).data;
                    const r = data[0], g = data[1], b = data[2];

                    const brightness = (r + g + b) / 3;
                    bits.push(brightness < 100 ? 1 : 0); 
                    
                    ctx.fillStyle = "yellow";
                    ctx.fillRect(px - 2, py - 2, 4, 4);
                }
            }

            // UI Border (Cyan on locked frame, Lime when seeking layout match)
            ctx.strokeStyle = validFrame ? "cyan" : "lime";
            ctx.lineWidth = 4;
            ctx.strokeRect(offsetX, offsetY, boxWidth, boxHeight);

            // Draw Inner 8x4 Grid lines
            ctx.strokeStyle = validFrame ? "rgba(0, 255, 255, 0.6)" : "rgba(0, 255, 0, 0.4)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let x = 1; x < COLS; x++) {
                ctx.moveTo(gridOffsetX + x * cellW, gridOffsetY);
                ctx.lineTo(gridOffsetX + x * cellW, gridOffsetY + gridHeight);
            }
            for (let y = 1; y < ROWS; y++) {
                ctx.moveTo(gridOffsetX, gridOffsetY + y * cellH);
                ctx.lineTo(gridOffsetX + gridWidth, gridOffsetY + y * cellH);
            }
            ctx.stroke();

            // Handle frame stabilization buffer
            if (validFrame) {
                buffer.push(bits);
                if (buffer.length > BUFFER_SIZE) { buffer.shift(); }
            } else {
                buffer = []; 
            }

            // Construct map hex ID URL string upon data validation
            if (buffer.length === BUFFER_SIZE) {
                const stable = majorityVote(buffer);
                const rank = parseInt(stable.slice(0,8).join(""), 2);
                const seed = parseInt(stable.slice(8,24).join(""), 2);
                const loc  = parseInt(stable.slice(24,32).join(""), 2);
                
                const rankHex = rank.toString(16).toUpperCase().padStart(2, '0');
                const seedHex = seed.toString(16).toUpperCase().padStart(4, '0');
                const locHex  = loc.toString(16).toUpperCase().padStart(2, '0');
                
                currentDecodedUrl = `https://dqix.github.io/Grotto-Searcher/?id=${rankHex}${seedHex}${locHex}`;
            }
            
            requestAnimationFrame(scanLoop);
        }

        // Helper function to smooth out noisy tracking data frames
        function majorityVote(frames) {
            let result = [];
            const totalBits = frames[0].length;
            for (let i = 0; i < totalBits; i++) {
                let ones = 0;
                for (let j = 0; j < frames.length; j++) {
                    if (frames[j][i] === 1) ones++;
                }
                result.push(ones > frames.length / 2 ? 1 : 0);
            }
            return result;
        }

        // Redirect interaction execution handling
        captureBtn.addEventListener("click", () => {
            if (currentDecodedUrl) {
                window.location.href = currentDecodedUrl;
            } else {
                alert("No stable data locked on yet! Ensure the grid turns Cyan before capturing.");
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DQ9 Map ID Scanner</title>
</head>
<body style="font-family: sans-serif; background: #222; color: #fff; margin: 0; padding: 20px; text-align: center;">

    <video id="cam" autoplay playsinline style="display:none;"></video>
    <canvas id="c" style="width: 100%; max-width: 500px; border: 2px solid #555; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);"></canvas>

    <div style="margin-top: 20px;">
        <button id="captureBtn" style="padding: 15px 30px; font-size: 20px; font-weight: bold; background-color: #00bcd4; color: white; border: none; border-radius: 5px; cursor: pointer; transition: 0.2s;">
            Capture & Redirect
        </button>
    </div>

    <div style="margin-top: 20px; max-width: 500px; margin-left: auto; margin-right: auto; background: #333; padding: 10px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">
        <table style="width: 100%; border-collapse: collapse; text-align: center; font-family: monospace; font-size: 18px;">
            <thead>
                <tr style="border-bottom: 2px solid #666; color: #00bcd4;">
                    <th style="padding: 8px;">FQ</th>
                    <th style="padding: 8px;">Rank</th>
                    <th style="padding: 8px;">Seed</th>
                    <th style="padding: 8px;">@</th>
                </tr>
            </thead>
            <tbody id="logBody">
                </tbody>
        </table>
    </div>

    <script>
        const video = document.getElementById("cam");
        const canvas = document.getElementById("c");
        const ctx = canvas.getContext("2d");
        const captureBtn = document.getElementById("captureBtn");
        const logBody = document.getElementById("logBody");

        const COLS = 8;
        const ROWS = 4;
        let buffer = [];
        const BUFFER_SIZE = 5;

        // Store the fully parsed data object so the capture button can access it
        let currentData = null;

        navigator.mediaDevices.getUserMedia({ 
            video: { 
                facingMode: { ideal: "environment" } 
            } 
        })
        .then(stream => {
            video.srcObject = stream;
            video.play();
        })
        .catch(err => {
            alert("Camera error diagnostic: " + err.name + " - " + err.message);
        });

        function waitForVideo() {
            if (video.videoWidth === 0) {
                requestAnimationFrame(waitForVideo);
                return;
            }
            scanLoop();
        }
        video.onloadedmetadata = () => { waitForVideo(); };

        // Helper function to map original rank to categorized thresholds
        function categorizeRank(rankDec) {
            if (rankDec >= 2 && rankDec <= 55) return 0x02;
            if (rankDec >= 56 && rankDec <= 60) return 0x38;
            if (rankDec >= 61 && rankDec <= 75) return 0x3D;
            if (rankDec >= 76 && rankDec <= 80) return 0x4C;
            if (rankDec >= 81 && rankDec <= 100) return 0x51;
            if (rankDec >= 101 && rankDec <= 120) return 0x65;
            if (rankDec >= 121 && rankDec <= 140) return 0x79;
            if (rankDec >= 141 && rankDec <= 160) return 0x8D;
            if (rankDec >= 161 && rankDec <= 180) return 0xA1;
            if (rankDec >= 181 && rankDec <= 200) return 0xB5;
            if (rankDec >= 201 && rankDec <= 220) return 0xC9;
            if (rankDec >= 221 && rankDec <= 248) return 0xDD;
            return rankDec; // Fallback just in case
        }

        function scanLoop() {
            if (video.videoWidth === 0) {
                requestAnimationFrame(scanLoop); 
                return; 
            }
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            ctx.drawImage(video, 0, 0);
            
            const boxWidth = canvas.width * 0.8; 
            const boxHeight = boxWidth * (3 / 4); 
            const offsetX = (canvas.width - boxWidth) / 2;
            const offsetY = (canvas.height - boxHeight) / 2;

            const gridWidth = boxWidth; 
            const cellW = gridWidth / COLS;
            const cellH = cellW;
            const gridHeight = cellH * ROWS; 
            
            const gridOffsetX = offsetX;
            const gridOffsetY = offsetY + (boxHeight - gridHeight) / 2;

            let bits = [];
            let validFrame = true;

            function isMagenta(r, g, b) {
                return r > 130 && g < 130 && b > 130;
            }

            const corners = [
                { x: offsetX + 15, y: offsetY + 15 },
                { x: offsetX + boxWidth - 15, y: offsetY + 15 },
                { x: offsetX + 15, y: offsetY + boxHeight - 15 },
                { x: offsetX + boxWidth - 15, y: offsetY + boxHeight - 15 }
            ];

            for (let corner of corners) {
                const data = ctx.getImageData(corner.x, corner.y, 1, 1).data;
                if (!isMagenta(data[0], data[1], data[2])) {
                    validFrame = false; 
                }
                ctx.fillStyle = "magenta";
                ctx.fillRect(corner.x - 4, corner.y - 4, 8, 8);
            }

            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const px = Math.floor(gridOffsetX + x * cellW + cellW / 2);
                    const py = Math.floor(gridOffsetY + y * cellH + cellH / 2);
                    
                    const data = ctx.getImageData(px, py, 1, 1).data;
                    const r = data[0], g = data[1], b = data[2];

                    const brightness = (r + g + b) / 3;
                    bits.push(brightness < 100 ? 1 : 0); 
                    
                    ctx.fillStyle = "yellow";
                    ctx.fillRect(px - 2, py - 2, 4, 4);
                }
            }

            ctx.strokeStyle = validFrame ? "cyan" : "lime";
            ctx.lineWidth = 4;
            ctx.strokeRect(offsetX, offsetY, boxWidth, boxHeight);

            ctx.strokeStyle = validFrame ? "rgba(0, 255, 255, 0.6)" : "rgba(0, 255, 0, 0.4)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let x = 1; x < COLS; x++) {
                ctx.moveTo(gridOffsetX + x * cellW, gridOffsetY);
                ctx.lineTo(gridOffsetX + x * cellW, gridOffsetY + gridHeight);
            }
            for (let y = 1; y < ROWS; y++) {
                ctx.moveTo(gridOffsetX, gridOffsetY + y * cellH);
                ctx.lineTo(gridOffsetX + gridWidth, gridOffsetY + y * cellH);
            }
            ctx.stroke();

            if (validFrame) {
                buffer.push(bits);
                if (buffer.length > BUFFER_SIZE) { buffer.shift(); }
            } else {
                buffer = []; 
                currentData = null; // Clear data if tracking is lost
            }

            if (buffer.length === BUFFER_SIZE) {
                const stable = majorityVote(buffer);
                
                // Parse raw values
                const rawRankDec = parseInt(stable.slice(0,8).join(""), 2);
                const seedDec = parseInt(stable.slice(8,24).join(""), 2);
                const locDec  = parseInt(stable.slice(24,32).join(""), 2);
                
                // Categorize Rank
                const catRankDec = categorizeRank(rawRankDec);

                // Format to Hex
                const fqHex   = rawRankDec.toString(16).toUpperCase().padStart(2, '0');
                const rankHex = catRankDec.toString(16).toUpperCase().padStart(2, '0');
                const seedHex = seedDec.toString(16).toUpperCase().padStart(4, '0');
                const locHex  = locDec.toString(16).toUpperCase().padStart(2, '0');
                
                // Store object for capture button
                currentData = {
                    fq: fqHex,
                    rank: rankHex,
                    seed: seedHex,
                    loc: locHex,
                    url: `https://dqix.github.io/Grotto-Searcher/?id=${rankHex}${seedHex}`
                };
            }
            
            requestAnimationFrame(scanLoop);
        }

        function majorityVote(frames) {
            let result = [];
            const totalBits = frames[0].length;
            for (let i = 0; i < totalBits; i++) {
                let ones = 0;
                for (let j = 0; j < frames.length; j++) {
                    if (frames[j][i] === 1) ones++;
                }
                result.push(ones > frames.length / 2 ? 1 : 0);
            }
            return result;
        }

        captureBtn.addEventListener("click", () => {
            if (currentData) {
                // 1. Log the captured data to the table
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td style="padding: 6px;">${currentData.fq}</td>
                    <td style="padding: 6px; font-weight: bold; color: #00bcd4;">${currentData.rank}</td>
                    <td style="padding: 6px;">${currentData.seed}</td>
                    <td style="padding: 6px;">${currentData.loc}</td>
                `;
                // Prepends to put the newest scan at the top of the list
                logBody.insertBefore(tr, logBody.firstChild);

                // 2. Open Grotto Searcher in a new tab
                window.open(currentData.url, '_blank');
            } else {
                alert("No stable data locked on yet! Ensure the grid turns Cyan before capturing.");
            }
        });
    </script>
</body>
</html>

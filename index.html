<video id="cam" autoplay playsinline style="display:none;"></video>
<canvas id="c" style="width: 100%; max-width: 500px; border: 2px solid black;"></canvas>

<div style="text-align: center; margin-top: 20px;">
    <button id="captureBtn" style="padding: 15px 30px; font-size: 20px; font-weight: bold; cursor: pointer;">
        Capture & Redirect
    </button>
</div>

<script>
    const video = document.getElementById("cam");
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const captureBtn = document.getElementById("captureBtn");
    
    const COLS = 8;
    const ROWS = 4;
    let buffer = [];
    const BUFFER_SIZE = 5;
    
    let currentDecodedUrl = "";

    // 1. start camera
    navigator.mediaDevices.getUserMedia({video: { facingMode: "environment" } })
        .then(stream => {
            video.srcObject = stream; 
            video.play(); 
        });

    function waitForVideo() {
        if (video.videoWidth === 0) {
            requestAnimationFrame(waitForVideo); 
            return; 
        } 
        scanLoop(); 
    }
    video.onloadedmetadata = () => { waitForVideo(); };

    // 3. main loop
    function scanLoop() {
        if (video.videoWidth === 0) {
            requestAnimationFrame(scanLoop); 
            return; 
        }
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        ctx.drawImage(video, 0, 0);
        
        // Define targeting box (adjust 0.8 if you want it larger/smaller on screen)
        const boxWidth = canvas.width * 0.8; 
        const boxHeight = boxWidth * (ROWS / COLS); 
        
        const offsetX = (canvas.width - boxWidth) / 2;
        const offsetY = (canvas.height - boxHeight) / 2;

        // Draw outer targeting box
        ctx.strokeStyle = "lime";
        ctx.lineWidth = 4;
        ctx.strokeRect(offsetX, offsetY, boxWidth, boxHeight);

        const cellW = boxWidth / COLS;
        const cellH = boxHeight / ROWS;
        
        // Draw inner grid
        ctx.strokeStyle = "rgba(0, 255, 0, 0.4)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let x = 1; x < COLS; x++) {
            ctx.moveTo(offsetX + x * cellW, offsetY);
            ctx.lineTo(offsetX + x * cellW, offsetY + boxHeight);
        }
        for (let y = 1; y < ROWS; y++) {
            ctx.moveTo(offsetX, offsetY + y * cellH);
            ctx.lineTo(offsetX + boxWidth, offsetY + y * cellH);
        }
        ctx.stroke();

        let bits = [];
        let validFrame = true; // Assume good alignment until we hit magenta

        for (let y = 0; y < ROWS; y++) {
            for (let x = 0; x < COLS; x++) {
                const px = Math.floor(offsetX + x * cellW + cellW / 2);
                const py = Math.floor(offsetY + y * cellH + cellH / 2);
                
                // Draw Cyan dots (highly visible against Magenta/Black/White)
                ctx.fillStyle = "cyan";
                ctx.fillRect(px - 2, py - 2, 4, 4);

                const data = ctx.getImageData(px, py, 1, 1).data;
                const r = data[0], g = data[1], b = data[2];

                // Detect Magenta background (High R, Low G, High B)
                // If we see magenta, the camera is misaligned.
                if (r > 150 && g < 120 && b > 150) {
                    validFrame = false;
                }

                // Black is 1, White is 0
                // We use a simple threshold: if it's generally dark, it's black.
                const brightness = (r + g + b) / 3;
                bits.push(brightness < 100 ? 1 : 0); 
            }
        }
        
        // ONLY save the frame data if we didn't accidentally sample the magenta background
        if (validFrame) {
            buffer.push(bits);
            if (buffer.length > BUFFER_SIZE) { buffer.shift(); }
            
            // Optional: Change box color to show it's successfully locked on
            ctx.strokeStyle = "cyan";
            ctx.strokeRect(offsetX, offsetY, boxWidth, boxHeight);
        } else {
            // Clear buffer if we lose alignment
            buffer = [];
        }

        if (buffer.length === BUFFER_SIZE) {
            const stable = majorityVote(buffer);
            const rank = parseInt(stable.slice(0,8).join(""), 2);
            const seed = parseInt(stable.slice(8,24).join(""), 2);
            const loc  = parseInt(stable.slice(24,32).join(""), 2);
            
            currentDecodedUrl = `https://dqix.github.io/Grotto-Searcher/?id=${rank}${seed}`;
        }
        
        requestAnimationFrame(scanLoop);
    }

    function majorityVote(frames) {
        const result = [];
        for (let i = 0; i < frames[0].length; i++) {
            let sum = 0;
            for (let f = 0; f < frames.length; f++) {
                sum += frames[f][i];
            }
            result.push(sum > frames.length / 2 ? 1 : 0);
        }
        return result;
    }

    captureBtn.addEventListener("click", () => {
        if (currentDecodedUrl && buffer.length === BUFFER_SIZE) {
            console.log("Redirecting to:", currentDecodedUrl);
            window.location.href = currentDecodedUrl;
        } else {
            alert("Please align the grid! Make sure all cyan dots are inside the black/white squares.");
        }
    });
</script>
